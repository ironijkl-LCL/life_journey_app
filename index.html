<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>生命之旅｜循道衛理中心 安老院舍外展專業服務</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />

  <style>
    /* =====================================================================
       BASE & PASTORAL WATERCOLOR THEME
       ===================================================================== */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "PingFang HK", "Microsoft JhengHei", sans-serif;
      color: #1F2937;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background-color: #EBF6FC;
    }

    /* Authentic Watercolor Pastoral Sky & Meadow Background (Slides 1-3) */
    .pastoral-bg {
      background:
        radial-gradient(circle at 18% 18%, rgba(191, 232, 255, 0.85) 0%, rgba(191, 232, 255, 0) 52%),
        radial-gradient(circle at 80% 24%, rgba(254, 240, 138, 0.52) 0%, rgba(254, 240, 138, 0) 48%),
        radial-gradient(circle at 85% 82%, rgba(190, 230, 130, 0.65) 0%, rgba(190, 230, 130, 0) 52%),
        linear-gradient(180deg, #E3F3FC 0%, #F4FAEC 58%, #E1EFC5 100%);
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 12px 32px rgba(27, 67, 50, 0.12);
    }

    /* =====================================================================
       EXACT 12x12 MONOPOLY BOARD (MATCHING REFERENCE IMAGE 100%)
       ===================================================================== */
    .board-wrapper {
      width: 100%;
      max-width: min(96vw, 90vh, 840px);
      aspect-ratio: 1 / 1;
      background: #1F8A4C;
      padding: 2px;
      box-shadow: 0 18px 46px rgba(20, 68, 42, 0.24);
      border-radius: 6px;
    }

    .board-grid {
      display: grid;
      grid-template-columns: 1.48fr repeat(10, 1fr) 1.48fr;
      grid-template-rows: 1.48fr repeat(10, 1fr) 1.48fr;
      width: 100%;
      height: 100%;
      background: #1F8A4C;
      gap: 2px;
    }

    .board-tile {
      position: relative;
      display: flex;
      cursor: pointer;
      user-select: none;
      overflow: hidden;
      transition: transform 0.14s ease, box-shadow 0.14s ease;
    }

    .board-tile:hover {
      z-index: 30;
      transform: scale(1.07);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
    }

    .board-tile.active-landed {
      z-index: 35;
      outline: 3.5px solid #F59E0B;
      box-shadow: 0 0 0 5px rgba(245, 158, 11, 0.4);
    }

    /* Two-part tile sub-sections */
    .tile-char-zone {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .tile-num-strip {
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #2B5EA7;
      text-decoration: underline;
      text-underline-offset: 2px;
      text-decoration-thickness: 2px;
      line-height: 1;
      font-size: clamp(10px, 1.35vw, 15px);
    }

    /* Orientation rules for the 4 edges */
    .edge-left {
      flex-direction: row;
    }
    .edge-left .tile-char-zone {
      width: 68%;
      height: 100%;
      background: #F4A298;
      border-right: 2px solid #1F8A4C;
    }
    .edge-left .tile-num-strip {
      width: 32%;
      height: 100%;
      background: #FDF3EF;
    }

    .edge-top {
      flex-direction: column;
    }
    .edge-top .tile-char-zone {
      width: 100%;
      height: 68%;
      background: #F59B38;
      border-bottom: 2px solid #1F8A4C;
    }
    .edge-top .tile-num-strip {
      width: 100%;
      height: 32%;
      background: #EEF4B8;
    }

    .edge-right {
      flex-direction: row;
    }
    .edge-right .tile-num-strip {
      width: 32%;
      height: 100%;
      background: #F6F7D0;
      border-right: 2px solid #1F8A4C;
    }
    .edge-right .tile-char-zone {
      width: 68%;
      height: 100%;
      background: #63CCC0;
    }

    .edge-bottom {
      flex-direction: column;
    }
    .edge-bottom .tile-num-strip {
      width: 100%;
      height: 32%;
      background: #D5EEFC;
      border-bottom: 2px solid #1F8A4C;
    }
    .edge-bottom .tile-char-zone {
      width: 100%;
      height: 68%;
      background: #71A6DE;
    }

    /* Corner Tiles */
    .corner-tile {
      background: #EFF7EC;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2px;
    }

    /* Pure White Center Interior */
    .board-center {
      grid-column: 2 / 12;
      grid-row: 2 / 12;
      background: #FFFFFF;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* 4 Diagonal Dashed Card Zones in Center */
    .diag-deck {
      position: absolute;
      width: 29%;
      height: 14.5%;
      background: #FDFBE8;
      border: 2px dashed #4FA36B;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
      z-index: 10;
      box-shadow: 0 3px 10px rgba(31, 138, 76, 0.08);
    }
    .diag-deck:hover {
      background: #FFFCE0;
      box-shadow: 0 6px 18px rgba(31, 138, 76, 0.2);
    }
    .diag-deck-tl { top: 13%; left: 4%; transform: rotate(-45deg); }
    .diag-deck-tl:hover { transform: rotate(-45deg) scale(1.07); }
    .diag-deck-tr { top: 13%; right: 4%; transform: rotate(45deg); }
    .diag-deck-tr:hover { transform: rotate(45deg) scale(1.07); }
    .diag-deck-bl { bottom: 13%; left: 4%; transform: rotate(45deg); }
    .diag-deck-bl:hover { transform: rotate(45deg) scale(1.07); }
    .diag-deck-br { bottom: 13%; right: 4%; transform: rotate(-45deg); }
    .diag-deck-br:hover { transform: rotate(-45deg) scale(1.07); }

    .outlined-stage-label {
      font-weight: 900;
      font-size: clamp(12px, 2.2vw, 26px);
      letter-spacing: 0.08em;
      -webkit-text-stroke: 1.2px #1F2937;
      paint-order: stroke fill;
      text-shadow: 1px 1px 0 rgba(0,0,0,0.18);
    }

    /* Player Pawns */
    .pawn-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 2px;
      pointer-events: none;
      z-index: 20;
      padding: 2px;
    }
    .pawn-token {
      width: clamp(13px, 1.8vw, 20px);
      height: clamp(13px, 1.8vw, 20px);
      border-radius: 9999px;
      border: 2.5px solid #FFFFFF;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45), 0 0 8px rgba(255, 255, 255, 0.8);
      animation: pawnPulse 1.8s ease-in-out infinite;
    }
    @keyframes pawnPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    /* =====================================================================
       STAGE-SPECIFIC MODAL THEMES (MATCHING SLIDES)
       ===================================================================== */
    .theme-infancy {
      background-color: #FCE7D9;
      border-color: #F4A298;
    }
    .theme-youth {
      background-color: #FCFBF7;
      border-color: #00BCC6;
    }
    .theme-adult {
      background-color: #FAF8EE;
      border: 8px solid #4A7C59;
    }
    .theme-elder {
      background-color: #E6E2D6;
      border-color: #B8B0A0;
    }

    /* Youth cyan stepped corner blocks */
    .youth-block {
      position: absolute;
      background: #00BCC6;
      pointer-events: none;
      z-index: 0;
    }

    /* =====================================================================
       WIDGET ANIMATIONS
       ===================================================================== */
    @keyframes diceShake {
      0%, 100% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(-16deg) scale(1.14); }
      50% { transform: rotate(16deg) scale(1.16); }
      75% { transform: rotate(-10deg) scale(1.1); }
    }
    .dice-rolling { animation: diceShake 0.4s ease-in-out infinite; }

    @keyframes flameFlicker {
      0%, 100% { transform: scale(1) rotate(-2deg); opacity: 0.95; }
      50% { transform: scale(1.12, 0.9) rotate(3deg); opacity: 1; }
    }
    .candle-flame {
      animation: flameFlicker 0.55s ease-in-out infinite;
      transform-origin: bottom center;
    }

    @keyframes vinylSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .vinyl-spinning { animation: vinylSpin 5s linear infinite; }

    @keyframes breathPulse {
      0%, 100% { transform: scale(0.84); opacity: 0.78; }
      50% { transform: scale(1.16); opacity: 1; }
    }
    .taichi-breath { animation: breathPulse 6s ease-in-out infinite; }

    @keyframes confettiFall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(200px) rotate(360deg); opacity: 0; }
    }
    .confetti-piece {
      position: fixed;
      top: 10%;
      width: 12px;
      height: 12px;
      border-radius: 3px;
      pointer-events: none;
      z-index: 150;
      animation: confettiFall 1.5s ease-out forwards;
    }

    .mtr-blur {
      filter: blur(12px);
      transition: filter 0.45s ease;
    }
    .mtr-clear {
      filter: blur(0px);
      transition: filter 0.45s ease;
    }

    @keyframes flashEffect {
      0% { background: rgba(255,255,255,0.92); }
      100% { background: rgba(255,255,255,0); }
    }
    .flash-overlay { animation: flashEffect 0.35s ease-out; }

    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.18);
      border-radius: 9999px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- =====================================================================
       VIEW 1: COVER PAGE (Replicating Slide 1)
       ===================================================================== -->
  <section id="view-cover" class="pastoral-bg relative min-h-screen w-full flex flex-col justify-between p-5 sm:p-8 overflow-hidden">

      </g>
      <g transform="translate(465,695) scale(0.95)">
        <ellipse cx="0" cy="0" rx="18" ry="11" fill="#FFFDF5"/>
        <circle cx="14" cy="2" r="6" fill="#4B5563"/>
        <line x1="-8" y1="8" x2="-8" y2="16" stroke="#4B5563" stroke-width="2.5"/>
        <line x1="8" y1="8" x2="8" y2="16" stroke="#4B5563" stroke-width="2.5"/>

      <!-- Lush Yellow-Green Watercolor Bush on Right -->
      <g opacity="0.88">

      </g>
    </svg>

    <!-- Top-Left Authentic Institutional Header -->
    <header class="relative z-10 flex flex-wrap items-start justify-between gap-4">
      <div class="glass-panel rounded-2xl px-4 py-3 flex items-center gap-3.5 max-w-2xl">
        <!-- Methodist Centre Green M Emblem -->
        <svg class="w-14 h-14 shrink-0" viewBox="0 0 120 120" aria-label="循道衛理中心標誌">
          <path d="M16,62 L44,34 C46,20 74,20 76,34 L104,62 C96,90 78,104 60,104 C42,104 24,90 16,62 Z" fill="#FFFFFF" stroke="#007A4D" stroke-width="4.5" stroke-linejoin="round"/>
          <path d="M35,84 L35,46 L60,64 L85,46 L85,84 L71,84 L71,65 L60,74 L49,65 L49,84 Z" fill="#007A4D"/>

          <div class="text-sm sm:text-base font-bold text-[#007A4D]">安老院舍外展專業服務</div>
          <div class="text-[11px] sm:text-xs font-medium text-[#007A4D]/85">Multi-Disciplinary Outreaching Support Team for the Elderly</div>

    <!-- Center Olive-Green Brush Title + Two Clear Entry Buttons -->

      <h1 class="text-6xl sm:text-7xl md:text-8xl font-black text-[#456628] tracking-[0.18em] drop-shadow-[0_3px_0_rgba(255,255,255,0.9)] mb-4">
        生命之旅
      </h1>
      <p class="text-lg sm:text-2xl font-bold text-[#3F5E2A] bg-white/65 backdrop-blur-sm px-5 py-2 rounded-full mb-8 shadow-sm">

            <span class="text-5xl group-hover:scale-110 transition-transform">🎲</span>
            <span class="px-3 py-1 rounded-full bg-emerald-100 text-emerald-800 text-xs sm:text-sm font-black">12×12 完整棋盤</span>
          </div>
          <h2 class="text-2xl sm:text-3xl font-black text-[#1F6E42] mb-1">開始大富翁棋盤</h2>
          <p class="text-sm sm:text-base text-gray-700 font-medium">原版四邊成長棋盤、2–4 組分隊擲骰、40 格任務＋4 互動角落。</p>

        <button onclick="switchView('menu')" class="group glass-panel rounded-3xl p-6 sm:p-7 text-left hover:scale-[1.03] hover:bg-white transition-all border-2 border-[#2B5EA7]/35 shadow-xl">

        </button>

    <footer class="relative z-10 text-center text-xs sm:text-sm font-bold text-[#3B5E2B]/80">
      🌼 100% 離線可用・專為 iPad 觸控及院舍大螢幕投屏設計

  <!-- =====================================================================
       VIEW 2: 4-STAGE QUICK MENU (Replicating Slide 2)
       ===================================================================== -->

      <!-- Slide 2 Authentic 2x2 Pale-Cream Cards with Royal-Blue Underlined Titles -->

      <!-- 1-10 Tile Picker for Selected Stage -->

  <!-- =====================================================================
       JAVASCRIPT APPLICATION ENGINE
       ===================================================================== -->
  <script>
    /* =====================================================================
       1. SOUND EFFECTS (WEB AUDIO API) & CANTONESE SPEECH (zh-HK)
       ===================================================================== */
    const SoundFX = {
      enabled: true,
      ctx: null,
      melodyTimer: null,

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      },

      playTone(freq, duration = 0.15, type = 'sine', volume = 0.18, delay = 0) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime + delay;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(volume, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + duration + 0.02);
      },

      playDice() {
        if (!this.enabled) return;
        for (let i = 0; i < 6; i++) this.playTone(230 + Math.random() * 250, 0.05, 'triangle', 0.15, i * 0.07);
      },
      playStep() { this.playTone(540, 0.07, 'sine', 0.14); },
      playChime() {
        this.playTone(523.25, 0.2, 'sine', 0.18, 0);
        this.playTone(659.25, 0.2, 'sine', 0.18, 0.1);
        this.playTone(783.99, 0.34, 'sine', 0.2, 0.2);
      },
      playTick() { this.playTone(880, 0.05, 'square', 0.07); },
      playBell() {
        this.playTone(1046.5, 0.5, 'sine', 0.22, 0);
        this.playTone(1318.5, 0.6, 'sine', 0.16, 0.08);
      },
      playHorn() {
        this.playTone(340, 0.18, 'sawtooth', 0.14, 0);
        this.playTone(430, 0.18, 'sawtooth', 0.14, 0);
        this.playTone(340, 0.28, 'sawtooth', 0.14, 0.24);
        this.playTone(430, 0.28, 'sawtooth', 0.14, 0.24);
      },
      playShutter() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const size = Math.floor(this.ctx.sampleRate * 0.08);
        const buf = this.ctx.createBuffer(1, size, this.ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < size; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (size * 0.25));
        const src = this.ctx.createBufferSource();
        src.buffer = buf;
        const g = this.ctx.createGain();
        g.gain.value = 0.25;
        src.connect(g); g.connect(this.ctx.destination);
        src.start();
      },
      playApplause() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        for (let i = 0; i < 16; i++) {
          const delay = i * 0.11 + Math.random() * 0.04;
          const size = Math.floor(this.ctx.sampleRate * 0.09);
          const buf = this.ctx.createBuffer(1, size, this.ctx.sampleRate);
          const data = buf.getChannelData(0);
          for (let j = 0; j < size; j++) data[j] = (Math.random() * 2 - 1) * Math.exp(-j / (size * 0.35));
          const src = this.ctx.createBufferSource();
          src.buffer = buf;
          const f = this.ctx.createBiquadFilter();
          f.type = 'bandpass'; f.frequency.value = 1100 + Math.random() * 800;
          const g = this.ctx.createGain(); g.gain.value = 0.16;
          src.connect(f); f.connect(g); g.connect(this.ctx.destination);
          src.start(this.ctx.currentTime + delay);
        }
      },
      stopMelody() {
        if (this.melodyTimer) { clearTimeout(this.melodyTimer); this.melodyTimer = null; }
      },
      playMelody(key) {
        this.stopMelody();
        if (!this.enabled) { showToast('請先開啟音效以播放伴奏 🔊'); return; }
        const melodies = {
          moon: [[392,0.38],[440,0.38],[392,0.38],[330,0.38],[294,0.38],[330,0.38],[392,0.75],[523,0.38],[440,0.38],[392,0.38],[330,0.38],[294,0.38],[330,0.38],[262,0.75]],
          spin: [[523,0.34],[523,0.34],[587,0.34],[523,0.34],[440,0.34],[392,0.34],[440,0.68],[392,0.34],[440,0.34],[523,0.34],[440,0.34],[392,0.34],[330,0.34],[262,0.68]],
          old1: [[330,0.35],[392,0.35],[440,0.5],[523,0.35],[440,0.35],[392,0.65],[330,0.35],[294,0.35],[330,0.7]],
          old2: [[294,0.28],[392,0.28],[440,0.28],[523,0.45],[440,0.28],[392,0.45],[587,0.35],[523,0.65]],
          old3: [[392,0.4],[330,0.4],[294,0.4],[262,0.6],[330,0.4],[392,0.4],[440,0.7]],
          old4: [[523,0.3],[440,0.3],[392,0.3],[440,0.3],[523,0.45],[587,0.3],[523,0.65]]
        };
        const notes = melodies[key] || melodies.moon;
        let idx = 0;
        const next = () => {
          if (idx >= notes.length) { this.melodyTimer = null; return; }
          const [f, d] = notes[idx++];
          this.playTone(f, d * 0.9, 'sine', 0.16, 0);
          this.melodyTimer = setTimeout(next, d * 1000);
        };
        next();
      }
    };

    function toggleSound() {
      SoundFX.enabled = !SoundFX.enabled;
      if (!SoundFX.enabled) SoundFX.stopMelody();
      document.querySelectorAll('.sound-icon').forEach(el => el.textContent = SoundFX.enabled ? '🔊' : '🔇');
      document.querySelectorAll('.sound-label').forEach(el => el.textContent = SoundFX.enabled ? '音效：開' : '音效：關');
      if (SoundFX.enabled) SoundFX.playChime();
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) { showToast('此瀏覽器暫不支援語音朗讀'); return; }
      try {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'zh-HK'; u.rate = 0.88;
        const voices = window.speechSynthesis.getVoices();
        const hk = voices.find(v => v.lang.toLowerCase().includes('zh-hk') || v.lang.toLowerCase().includes('yue'))
                || voices.find(v => v.lang.toLowerCase().includes('zh'));
        if (hk) u.voice = hk;
        window.speechSynthesis.speak(u);
      } catch (e) {}
    }

    function showToast(msg) {
      const box = document.getElementById('toast-box');
      box.textContent = msg;
      box.classList.remove('opacity-0'); box.classList.add('opacity-100');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => { box.classList.remove('opacity-100'); box.classList.add('opacity-0'); }, 2400);
    }

    function launchConfetti() {
      const colors = ['#F59E0B', '#10B981', '#3B82F6', '#EC4899', '#8B5CF6', '#EF4444'];
      for (let i = 0; i < 28; i++) {
        const el = document.createElement('div');
        el.className = 'confetti-piece';
        el.style.left = (10 + Math.random() * 80) + 'vw';
        el.style.backgroundColor = colors[i % colors.length];
        el.style.animationDelay = (Math.random() * 0.35) + 's';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1900);
      }
    }

    /* =====================================================================
       7. EXACT 12x12 BOARD RENDERING & SIDE PANEL SYNC
       ===================================================================== */
    function getGridPos(index) {
      // Index 0 = Bottom-Left Corner (row 12, col 1)
      if (index === 0) return { row: 12, col: 1 };
      // Left Edge (Bottom to Top, 1..10): rows 11..2, col 1
      if (index >= 1 && index <= 10) return { row: 12 - index, col: 1, edge: 'edge-left' };
      // Index 11 = Top-Left Corner (row 1, col 1)
      if (index === 11) return { row: 1, col: 1 };
      // Top Edge (Left to Right, 1..10): row 1, cols 2..11
      if (index >= 12 && index <= 21) return { row: 1, col: index - 10, edge: 'edge-top' };
      // Index 22 = Top-Right Corner (row 1, col 12)
      if (index === 22) return { row: 1, col: 12 };
      // Right Edge (Top to Bottom, 1..10): rows 2..11, col 12
      if (index >= 23 && index <= 32) return { row: index - 21, col: 12, edge: 'edge-right' };
      // Index 33 = Bottom-Right Corner (row 12, col 12)
      if (index === 33) return { row: 12, col: 12 };
      // Bottom Edge (Right to Left, 1..10): row 12, cols 11..2
      return { row: 12, col: 12 - (index - 33), edge: 'edge-bottom' };
    }

    function renderBoard() {
      const boardEl = document.getElementById('monopoly-board');
      boardEl.innerHTML = '';

      for (let i = 0; i < 44; i++) {
        const pos = getGridPos(i);
        const tileEl = document.createElement('div');
        tileEl.id = `board-tile-${i}`;
        tileEl.style.gridRow = pos.row;
        tileEl.style.gridColumn = pos.col;

        if (CORNERS[i]) {
          const c = CORNERS[i];
          tileEl.className = 'board-tile corner-tile';
          tileEl.title = `${c.title}：${c.desc}`;
          tileEl.onclick = () => openSpaceModal(i, 'board');
          tileEl.innerHTML = `
            ${getCornerCoupleSVG(c.cornerKey)}
            <div class="text-[9px] sm:text-[11px] font-black leading-tight text-center mt-0.5 px-1 rounded bg-white/80" style="color:${c.accent}">${c.title}</div>
          `;
        } else {
          const task = TASK_BY_INDEX[i];
          const done = state.completedTiles.has(i);
          const isGirl = task.num % 2 === 0;
          tileEl.className = `board-tile ${pos.edge}`;
          tileEl.title = `${STAGES[task.stage].name} ${task.num}：${task.title}`;
          tileEl.onclick = () => openSpaceModal(i, 'board');

          const charZone = `<div class="tile-char-zone">${getStageCharSVG(task.stage, isGirl)}</div>`;
          const numStrip = `<div class="tile-num-strip">${task.num}</div>`;

          // Respect inner-facing strip placement for every edge
          if (pos.edge === 'edge-left' || pos.edge === 'edge-top') {
            tileEl.innerHTML = charZone + numStrip;
          } else {
            tileEl.innerHTML = numStrip + charZone;
          }

          if (done) {
            const check = document.createElement('span');
            check.className = 'absolute top-0.5 right-0.5 w-3.5 h-3.5 rounded-full bg-emerald-600 text-white text-[9px] font-black flex items-center justify-center shadow z-25';
            check.textContent = '✓';
            tileEl.appendChild(check);
          }
        }

        // Render Pawns on this tile
        const pawnWrap = document.createElement('div');
        pawnWrap.className = 'pawn-wrap';
        for (let t = 0; t < state.teamCount; t++) {
          if (state.teams[t].pos === i) {
            const dot = document.createElement('div');
            dot.className = 'pawn-token';
            dot.style.backgroundColor = state.teams[t].color;
            dot.title = state.teams[t].name;
            pawnWrap.appendChild(dot);
          }
        }
        tileEl.appendChild(pawnWrap);
        boardEl.appendChild(tileEl);
      }

      // Pure White Center with Methodist Centre Curved SVG Emblem & 4 Diagonal Dashed Card Zones
      const center = document.createElement('div');
      center.className = 'board-center';
      center.innerHTML = `
        <!-- Top-Left Diagonal Deck: 成年期 -->
        <button onclick="drawRandomStageCard('adult')" title="隨機抽取一格「成年期」題目" class="diag-deck diag-deck-tl">
          <span class="outlined-stage-label" style="color:#63CCC0;">成年期</span>

    function updateSidePanel() {
      document.getElementById('board-completed-count').textContent = state.completedTiles.size;

      // Team count buttons
      [2, 3, 4].forEach(n => {
        const b = document.getElementById('tc-btn-' + n);
        if (b) {
          b.className = state.teamCount === n
            ? 'tc-btn px-3 py-1 rounded-lg text-xs font-black bg-[#1F8A4C] text-white shadow'
            : 'tc-btn px-3 py-1 rounded-lg text-xs font-black bg-white text-emerald-900 border border-emerald-200';
        }
      });

      // Team turn list
      const listEl = document.getElementById('side-team-list');
      listEl.innerHTML = state.teams.slice(0, state.teamCount).map((tm, idx) => {
        const active = state.currentTeam === idx;
        const locName = CORNERS[tm.pos] ? CORNERS[tm.pos].title : `${STAGES[TASK_BY_INDEX[tm.pos].stage].name} ${TASK_BY_INDEX[tm.pos].num}`;
        return `
          <button onclick="selectActiveTeam(${idx})" class="w-full flex items-center justify-between px-3 py-2 rounded-xl border-2 transition text-left ${active ? 'bg-white shadow-md scale-[1.02]' : 'bg-white/60 opacity-80 hover:opacity-100'}" style="border-color:${active ? tm.color : 'transparent'}">
            <div class="flex items-center gap-2">
              <span class="w-3.5 h-3.5 rounded-full shadow-sm" style="background:${tm.color}"></span>
              <span class="font-black text-sm text-gray-900">${tm.name}</span>
              ${active ? '<span class="text-[10px] bg-gray-900 text-white px-1.5 py-0.5 rounded-full font-bold">目前回合</span>' : ''}
            </div>
            <span class="text-xs font-bold text-gray-600">${locName}</span>
          </button>
        `;
      }).join('');

      // Dice Button styling
      const curTeam = state.teams[state.currentTeam];
      document.getElementById('turn-indicator').textContent = `輪到 ${curTeam.emoji} ${curTeam.name} 擲骰`;
      document.getElementById('dice-btn-text').textContent = `${curTeam.name} 擲骰仔`;
      const btn = document.getElementById('btn-roll-dice');
      btn.style.background = `linear-gradient(135deg, ${curTeam.color}, #1F2937)`;
      btn.disabled = state.isRolling;
    }

    function drawRandomStageCard(stageKey) {
      const stageTasks = TASKS.filter(t => t.stage === stageKey);
      const unplayed = stageTasks.filter(t => !state.completedTiles.has(t.boardIndex));
      const pool = unplayed.length > 0 ? unplayed : stageTasks;
      const picked = pool[Math.floor(Math.random() * pool.length)];
      SoundFX.playDice();
      showToast(`從「${STAGES[stageKey].name}」抽出第 ${picked.num} 格：${picked.title}`);
      openSpaceModal(picked.boardIndex, 'board');
    }

    function setTeamCount(n) {
      state.teamCount = n;
      if (state.currentTeam >= n) state.currentTeam = 0;
      renderBoard();
    }

    function selectActiveTeam(idx) {
      if (state.isRolling) return;
      state.currentTeam = idx;
      updateSidePanel();
    }

    function rollDice() {
      if (state.isRolling) return;
      state.isRolling = true;
      SoundFX.playDice();

      const diceEl = document.getElementById('dice-face');
      const faces = ['⚀','⚁','⚂','⚃','⚄','⚅'];
      if (diceEl) diceEl.classList.add('dice-rolling');

      let ticks = 0;
      const rollInt = setInterval(() => {
        if (diceEl) diceEl.textContent = faces[Math.floor(Math.random() * 6)];
        ticks++;
        if (ticks >= 10) {
          clearInterval(rollInt);
          const result = Math.floor(Math.random() * 6) + 1;
          if (diceEl) { diceEl.classList.remove('dice-rolling'); diceEl.textContent = faces[result - 1]; }
          showToast(`${state.teams[state.currentTeam].name} 擲出 ${result} 點！`);
          moveCurrentTeamSteps(result);
        }
      }, 65);
    }

    function moveCurrentTeamSteps(steps) {
      const teamIdx = state.currentTeam;
      let moved = 0;
      const stepInt = setInterval(() => {
        state.teams[teamIdx].pos = (state.teams[teamIdx].pos + 1) % 44;
        SoundFX.playStep();
        renderBoard();
        const tileEl = document.getElementById(`board-tile-${state.teams[teamIdx].pos}`);
        if (tileEl) tileEl.classList.add('active-landed');

        moved++;
        if (moved >= steps) {
          clearInterval(stepInt);
          const landedPos = state.teams[teamIdx].pos;
          setTimeout(() => {
            state.isRolling = false;
            state.currentTeam = (state.currentTeam + 1) % state.teamCount;
            renderBoard();
            openSpaceModal(landedPos, 'board');
          }, 420);
        }
      }, 230);
    }

    function openResetConfirm() { document.getElementById('reset-modal').classList.remove('hidden'); }
    function closeResetConfirm() { document.getElementById('reset-modal').classList.add('hidden'); }
    function confirmResetGame() {
      state.teams.forEach(t => t.pos = 0);
      state.currentTeam = 0;
      state.completedTiles.clear();
      closeResetConfirm();
      renderBoard();
      showToast('已重置所有組別與完成進度！');
    }

    /* =====================================================================
       8. MODAL CONTROLLER WITH AUTHENTIC STAGE THEMES
       ===================================================================== */
    function openSpaceModal(boardIndex, sourceView = 'board') {
      cleanupActiveResources();
      state.activeTileIndex = boardIndex;
      state.previousViewForModal = sourceView;

      const modal = document.getElementById('task-modal');
      const card = document.getElementById('task-modal-card');
      const youthDecor = document.getElementById('youth-decor');
      const badge = document.getElementById('modal-badge');
      const title = document.getElementById('modal-title');
      const body = document.getElementById('modal-body');
      const completeBtn = document.getElementById('btn-mark-complete');
      const swapBtn = document.getElementById('btn-swap-task');
      const backLabel = document.getElementById('modal-back-label');
      const footerExtra = document.getElementById('modal-footer-extra');

      backLabel.textContent = sourceView === 'menu' ? '返回選單' : '返回棋盤';
      footerExtra.innerHTML = '';
      card.className = 'relative w-full max-w-4xl max-h-[93vh] rounded-[26px] shadow-2xl flex flex-col overflow-hidden border-4';
      youthDecor.classList.add('hidden');

      if (CORNERS[boardIndex]) {
        const c = CORNERS[boardIndex];
        card.classList.add('bg-[#EFF7EC]', 'border-[#1F8A4C]');
        badge.style.backgroundColor = c.accent;
        badge.textContent = '輕鬆互動角落';
        title.style.color = c.accent;
        title.textContent = `${c.emoji} ${c.title}`;
        completeBtn.classList.add('hidden');
        swapBtn.classList.add('hidden');
        renderCornerWidget(c, body);
      } else {
        const task = TASK_BY_INDEX[boardIndex];
        const st = STAGES[task.stage];
        card.classList.add(st.themeClass);
        if (task.stage === 'youth') youthDecor.classList.remove('hidden');
        badge.style.backgroundColor = st.accent;
        badge.textContent = `${st.name} · 第 ${task.num} 格`;
        title.style.color = st.text;
        title.textContent = `${task.icon} ${task.title}`;
        completeBtn.classList.remove('hidden');
        swapBtn.classList.remove('hidden');
        updateCompleteButtonUI();
        renderTaskWidget(task, body, footerExtra);
      }

      modal.classList.remove('hidden');
      SoundFX.playChime();
    }

    function closeTaskModal() {
      cleanupActiveResources();
      document.getElementById('task-modal').classList.add('hidden');
      if (state.currentView === 'board') renderBoard();
      else if (state.currentView === 'menu') {
        const tilesVisible = !document.getElementById('menu-stage-tiles').classList.contains('hidden');
        if (tilesVisible && TASK_BY_INDEX[state.activeTileIndex]) {
          openStageList(TASK_BY_INDEX[state.activeTileIndex].stage);
        }
        updateMenuProgress();
      }
    }

    function gentleSwapTask() {
      const current = TASK_BY_INDEX[state.activeTileIndex];
      if (!current) return;
      const sameStage = TASKS.filter(t => t.stage === current.stage && t.boardIndex !== current.boardIndex);
      const next = sameStage[Math.floor(Math.random() * sameStage.length)];
      showToast(`已溫和換題：${STAGES[next.stage].name} 第 ${next.num} 格「${next.title}」`);
      openSpaceModal(next.boardIndex, state.previousViewForModal);
    }

    function updateCompleteButtonUI() {
      const btn = document.getElementById('btn-mark-complete');
      const done = state.completedTiles.has(state.activeTileIndex);
      btn.className = done
        ? 'bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl px-3.5 py-2 font-bold text-sm shadow-sm transition flex items-center gap-1'
        : 'bg-white/95 hover:bg-emerald-50 text-emerald-800 border border-emerald-300 rounded-xl px-3.5 py-2 font-bold text-sm shadow-sm transition flex items-center gap-1';
      btn.innerHTML = done ? '<span>✓</span> 已完成' : '<span>✅</span> 標記完成';
    }

    function toggleCurrentTileComplete() {
      if (state.activeTileIndex === null || CORNERS[state.activeTileIndex]) return;
      if (state.completedTiles.has(state.activeTileIndex)) state.completedTiles.delete(state.activeTileIndex);
      else { state.completedTiles.add(state.activeTileIndex); SoundFX.playChime(); showToast('好叻呀！已標記呢一格完成 🎉'); }
      updateCompleteButtonUI();
    }

    function speakCurrentTask() {
      if (CORNERS[state.activeTileIndex]) {
        const c = CORNERS[state.activeTileIndex];
        speakText(`${c.title}。${c.desc}`);
      } else if (TASK_BY_INDEX[state.activeTileIndex]) {
        const t = TASK_BY_INDEX[state.activeTileIndex];
        speakText(`${STAGES[t.stage].name}，第${t.num}格，${t.title}。${t.prompt}`);
      }
    }

    function renderHighLowCardGame(container, promptBanner, continuousMode) {
      const suits = ['♠️','♥️','♣️','♦️'];
      const drawCard = () => ({ val: Math.floor(Math.random()*10)+1, suit: suits[Math.floor(Math.random()*4)] });
      let hostCard = drawCard(), playerCard = null, streak = 0;

      container.innerHTML = promptBanner + `
        <div class="flex flex-col items-center">
          ${continuousMode ? `<div class="mb-3 px-4 py-1.5 rounded-full bg-amber-100 text-amber-900 font-black text-lg">🔥 連勝紀錄：<span id="hl-streak">0</span> 局</div>` : ''}
          <div class="grid grid-cols-2 gap-6 max-w-lg w-full mb-5">
            <div class="flex flex-col items-center">
              <div class="text-lg font-bold text-gray-700 mb-2">${continuousMode ? '目前張牌' : '主持人張牌'}</div>
              <div id="hl-host" class="w-32 h-44 sm:w-36 sm:h-48 rounded-3xl bg-white border-4 border-gray-800 shadow-xl flex flex-col items-center justify-center"></div>
            </div>
            <div class="flex flex-col items-center">
              <div class="text-lg font-bold text-gray-700 mb-2">${continuousMode ? '下一張牌' : '老友張牌'}</div>
              <div id="hl-player" class="w-32 h-44 sm:w-36 sm:h-48 rounded-3xl bg-gradient-to-br from-emerald-700 to-teal-900 border-4 border-white shadow-xl flex items-center justify-center text-6xl text-white font-black">?</div>
            </div>
          </div>
          <div id="hl-msg" class="text-2xl font-black text-gray-900 mb-5 min-h-[36px]">估下右邊張牌比左邊「大」定「細」？</div>
          <div class="flex flex-wrap justify-center gap-4">
            <button id="hl-big" class="bg-rose-600 hover:bg-rose-700 text-white px-8 py-4 rounded-2xl font-black text-2xl shadow-lg">⬆️ 估大</button>
            <button id="hl-small" class="bg-sky-600 hover:bg-sky-700 text-white px-8 py-4 rounded-2xl font-black text-2xl shadow-lg">⬇️ 估細</button>
            <button id="hl-next" class="bg-white border-2 border-gray-300 text-gray-800 px-6 py-4 rounded-2xl font-bold text-xl">🔄 換新牌</button>
          </div>
        </div>
      `;

      const paintCard = (el, card) => {
        const isRed = card.suit === '♥️' || card.suit === '♦️';
        el.className = `w-32 h-44 sm:w-36 sm:h-48 rounded-3xl bg-white border-4 border-gray-800 shadow-xl flex flex-col items-center justify-center ${isRed ? 'text-rose-600' : 'text-gray-900'}`;
        el.innerHTML = `<div class="text-4xl">${card.suit}</div><div class="text-6xl font-black leading-none mt-1">${card.val === 1 ? 'A' : card.val}</div>`;
      };

      const resetRound = (keepLast = false) => {
        hostCard = (keepLast && playerCard) ? playerCard : drawCard();
        playerCard = null;
        paintCard(container.querySelector('#hl-host'), hostCard);
        const pEl = container.querySelector('#hl-player');
        pEl.className = 'w-32 h-44 sm:w-36 sm:h-48 rounded-3xl bg-gradient-to-br from-emerald-700 to-teal-900 border-4 border-white shadow-xl flex items-center justify-center text-6xl text-white font-black';
        pEl.textContent = '?';
        container.querySelector('#hl-msg').textContent = '估下右邊張牌比左邊「大」定「細」？';
      };

      const guess = (dir) => {
        playerCard = drawCard(); paintCard(container.querySelector('#hl-player'), playerCard);
        const msgEl = container.querySelector('#hl-msg');
        if (playerCard.val === hostCard.val) { msgEl.textContent = '同點數打和！算你過關，再抽過！😄'; SoundFX.playStep(); }
        else if ((dir === 'big' && playerCard.val > hostCard.val) || (dir === 'small' && playerCard.val < hostCard.val)) {
          streak++; msgEl.textContent = '🎉 估中咗！好眼光呀老友！'; SoundFX.playApplause(); launchConfetti();
        } else { streak = 0; msgEl.textContent = '差少少咋！按「換新牌」再玩過！💪'; SoundFX.playStep(); }
        const stEl = container.querySelector('#hl-streak');
        if (stEl) stEl.textContent = streak;
      };

      container.querySelector('#hl-big').onclick = () => guess('big');
      container.querySelector('#hl-small').onclick = () => guess('small');
      container.querySelector('#hl-next').onclick = () => { SoundFX.playDice(); resetRound(continuousMode); };
      resetRound(false);
    }

    /* =====================================================================
       INIT
       ===================================================================== */
    window.addEventListener('DOMContentLoaded', () => {
      if ('speechSynthesis' in window) window.speechSynthesis.getVoices();
      renderBoard();
      updateMenuProgress();
    });
  </script>
</body>
</html>
